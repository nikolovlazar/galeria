[package]
name = "galeria"
version = "0.1.0"
description = "Museum-style painting wallpapers with info plates, slow panning and a distraction-free viewer."
authors = ["Lazar Nikolov"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "galeria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
# preserve_order: manifest.json is rewritten in place when paintings are downloaded,
# so key order must survive a round trip.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
notify = "8"
notify-debouncer-full = "0.5"
# Native TLS: Security.framework on macOS, SChannel on Windows, OpenSSL on Linux.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "charset", "gzip"] }
# Museum catalogues: NGA publishes open data as CSV, the Rijksmuseum as EDM/XML.
csv = "1"
roxmltree = "0.20"
# Transliterates titles (Cyrillic, Greek, diacritics) into safe file names.
deunicode = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
fast_image_resize = { version = "6", features = ["image"] }
imagesize = "0.15"
fastrand = "2"
percent-encoding = "2"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Image decoding/resizing is painfully slow unoptimized; keep it fast in dev builds too.
[profile.dev.package."*"]
opt-level = 3
