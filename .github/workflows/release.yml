name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS (arm64 DMG & update ZIP)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GALERIA_UPDATE_PUBKEY: ${{ vars.GALERIA_UPDATE_PUBKEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: |
          if [ -z "$GALERIA_UPDATE_PUBKEY" ]; then unset GALERIA_UPDATE_PUBKEY; fi
          cargo test --locked

      - name: Import Apple signing certificate (optional)
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          PASS="${KEYCHAIN_PASSWORD:-$(uuidgen)}"
          CERT="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASS" "$KEYCHAIN"
          rm -f "$CERT"
          echo "GALERIA_SIGN=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build Galeria.app
        run: |
          if [ -z "$GALERIA_UPDATE_PUBKEY" ]; then unset GALERIA_UPDATE_PUBKEY; fi
          packaging/macos/bundle.sh

      - name: Notarize and staple app (optional)
        if: env.GALERIA_SIGN != '' && env.APPLE_ID != '' && env.APPLE_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          ditto -c -k --sequesterRsrc --keepParent target/bundle/Galeria.app "$RUNNER_TEMP/Galeria-update.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Galeria-update.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple target/bundle/Galeria.app
          spctl -a -t exec -vv target/bundle/Galeria.app

      - name: Package updater ZIP and DMG
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          packaging/update/make_zip.sh target/bundle/Galeria.app target/bundle/Galeria-macos-arm64.zip
          GALERIA_APP=target/bundle/Galeria.app GALERIA_DMG_OUT="target/bundle/Galeria-${VERSION}-macos-arm64.dmg" packaging/macos/dmg.sh
          echo "DMG_PATH=target/bundle/Galeria-${VERSION}-macos-arm64.dmg" >> "$GITHUB_ENV"

      - name: Notarize DMG (optional)
        if: env.GALERIA_SIGN != '' && env.APPLE_ID != '' && env.APPLE_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            target/bundle/Galeria-*-macos-arm64.dmg
            target/bundle/Galeria-macos-arm64.zip
          if-no-files-found: error

  windows:
    name: Windows (x64 Setup & ZIP)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GALERIA_UPDATE_PUBKEY: ${{ vars.GALERIA_UPDATE_PUBKEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        shell: pwsh
        run: |
          if (-not $env:GALERIA_UPDATE_PUBKEY) { Remove-Item Env:GALERIA_UPDATE_PUBKEY -ErrorAction SilentlyContinue }
          cargo build --release --locked

      - name: Package installer and portable ZIP
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path target/bundle | Out-Null

          $stage = Join-Path $env:RUNNER_TEMP "Galeria-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/galeria.exe $stage/
          Copy-Item assets/icons/icon.ico $stage/
          Copy-Item LICENSE $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "target/bundle/Galeria-windows-x64.zip" -Force

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "target/bundle/Galeria-$version-windows-x64-setup.exe" "target/bundle/Galeria-windows-x64-setup.exe" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            target/bundle/Galeria-windows-x64-setup.exe
            target/bundle/Galeria-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux (x64 DEB & tar.gz)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GALERIA_UPDATE_PUBKEY: ${{ vars.GALERIA_UPDATE_PUBKEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxkbcommon-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build and package (.deb & .tar.gz)
        run: |
          if [ -z "$GALERIA_UPDATE_PUBKEY" ]; then unset GALERIA_UPDATE_PUBKEY; fi
          sh packaging/linux/package.sh
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mv "target/bundle/Galeria-${VERSION}-linux-x64.tar.gz" target/bundle/Galeria-linux-x64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            target/bundle/galeria_*_amd64.deb
            target/bundle/Galeria-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p dist
          cp artifacts/macos-arm64/Galeria-*-macos-arm64.dmg dist/
          cp artifacts/macos-arm64/Galeria-macos-arm64.zip dist/
          cp artifacts/windows-x64/Galeria-windows-x64-setup.exe artifacts/windows-x64/Galeria-windows-x64.zip dist/
          cp artifacts/linux-x64/Galeria-linux-x64.tar.gz artifacts/linux-x64/galeria_*_amd64.deb dist/

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate update feed
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          GALERIA_UPDATE_PUBKEY: ${{ vars.GALERIA_UPDATE_PUBKEY }}
        run: |
          PYTHON=python3
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            python3 -m venv "$RUNNER_TEMP/update-venv"
            "$RUNNER_TEMP/update-venv/bin/pip" install cryptography
            PYTHON="$RUNNER_TEMP/update-venv/bin/python"
          fi
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          "$PYTHON" packaging/update/latest_json.py --dist dist --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
